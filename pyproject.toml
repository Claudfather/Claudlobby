[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudlobby"
version = "0.1.0"
description = "Compositor for Claude Code agent fleets — assembles bots from a library of personas, skills, MCP fragments, guardrails, and protocols via fleet.yaml"
authors = [{ name = "Chris Rogers" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Pinned to a Claudron main SHA (F1 lock, plan 2026-07-07-claudron-consumption 1c).
# Move to the version tag / PyPI range at Claudron's first tagged release; bump per
# release after vault-mode tests pass. Compat floor: claudlobby/claudron_compat.py.
vault = ["claudron @ git+https://github.com/Claudfather/Claudron.git@bb84ee3ab9325c3a49c4f0274069c29eb2270768"]

[project.scripts]
claudlobby = "claudlobby.__main__:main"

[tool.setuptools]
packages = ["claudlobby", "claudlobby.commands"]
