name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        # tmux backs the move-bot integration tests; bash is used by a few
        # test_dotenv subprocess checks (already present on ubuntu runners).
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Rehearse real offline release assembly
        # Network access only obtains the inputs. Assembly itself uses the
        # generated hash lock with --no-index, then invokes its installed CLI.
        run: |
          release_work="$RUNNER_TEMP/claudlobby-release-assembly"
          mkdir -p "$release_work/dist" "$release_work/wheelhouse"
          .venv/bin/python -m build --wheel --no-isolation --outdir "$release_work/dist"
          .venv/bin/python -m pip download --only-binary=:all: \
            --dest "$release_work/wheelhouse" "$release_work/dist/"*.whl
          .venv/bin/python tests/release_assembly_smoke.py \
            --wheel "$release_work/dist/"*.whl --wheelhouse "$release_work/wheelhouse" \
            --disposable-root "$release_work/rehearsal"
      - name: Prepare installed resources for editable test imports
        # This runner checkout is disposable. Build from indexed source in a
        # separate temporary tree, then stage only wheel resource/native assets.
        # The Python package keeps its exact checkout origin for the P0 guard.
        run: .venv/bin/python tests/prepare_resources.py --disposable-checkout "$GITHUB_WORKSPACE"
      - name: Run tests
        # One pre-existing failure is deselected pending separate triage
        # (tracked in the issue thread for #229). The rest of the suite must
        # stay green.
        run: |
          printf 'running\n' > pytest.status
          test_scratch="$(mktemp -d)"
          mkdir -p "$test_scratch"/{home,tmp,config,cache,state,data}
          set +e
          env HOME="$test_scratch/home" TMPDIR="$test_scratch/tmp" \
            XDG_CONFIG_HOME="$test_scratch/config" XDG_CACHE_HOME="$test_scratch/cache" \
            XDG_STATE_HOME="$test_scratch/state" XDG_DATA_HOME="$test_scratch/data" \
            PLANE_EMIT_DISABLED=1 \
            .venv/bin/python -m pytest -v --maxfail=20 --junitxml=pytest-results.xml \
            --deselect tests/test_validator.py::TestHookCommandValidation::test_existing_absolute_command_no_warn 2>&1 | tee pytest.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > pytest.rc
          printf 'completed (exit %s)\n' "$result" > pytest.status
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-ubuntu-latest-py3.11
          path: |
            pytest.log
            pytest.rc
            pytest.status
            pytest-results.xml
            ${{ runner.temp }}/claudlobby-release-assembly/rehearsal/result.json
            ${{ runner.temp }}/claudlobby-release-assembly/rehearsal/dependency.lock
            ${{ runner.temp }}/claudlobby-release-assembly/rehearsal/*.log
          if-no-files-found: error

  supported-platforms:
    name: supported (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: macos-latest, python: '3.11'}
    runs-on: ${{ matrix.os }}
    # The first Mac run reached the real tmux harness at 91% before the
    # 30-minute job cap. Allow that bounded harness to finish and retain traces.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          for tool in tmux jq node; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
      - name: Install isolated package and report tool versions
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python --version
          command -v tmux jq node bash
          tmux -V
          jq --version
          node --version
          /bin/bash --version
      - name: Prepare installed resources for editable test imports
        # This runner checkout is disposable. Build from indexed source in a
        # separate temporary tree, then stage only wheel resource/native assets.
        # The Python package keeps its exact checkout origin for the P0 guard.
        run: .venv/bin/python tests/prepare_resources.py --disposable-checkout "$GITHUB_WORKSPACE"
      - name: Run supported-platform suite
        env:
          CLAUDLOBBY_CI_NATIVE_SMOKE: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          printf 'running\n' > pytest.status
          test_scratch="$(mktemp -d)"
          mkdir -p "$test_scratch"/{home,tmp,config,cache,state,data}
          set +e
          env HOME="$test_scratch/home" TMPDIR="$test_scratch/tmp" \
            XDG_CONFIG_HOME="$test_scratch/config" XDG_CACHE_HOME="$test_scratch/cache" \
            XDG_STATE_HOME="$test_scratch/state" XDG_DATA_HOME="$test_scratch/data" \
            PLANE_EMIT_DISABLED=1 \
            .venv/bin/python -m pytest -v --maxfail=20 --junitxml=pytest-results.xml \
            --deselect tests/test_validator.py::TestHookCommandValidation::test_existing_absolute_command_no_warn 2>&1 | tee pytest.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > pytest.rc
          printf 'completed (exit %s)\n' "$result" > pytest.status
          exit "$result"
      - name: Verify native evidence executed
        if: always() && runner.os == 'macOS'
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('pytest-results.xml').iter('testcase'))
          expected = {
              'test_native_plutil_accepts_composed_plist',
              'test_native_launchd_scratch_lifecycle[success]',
              'test_native_launchd_scratch_lifecycle[assertion-failure]',
              'test_native_host_long_exec_path_reads_up',
              'test_native_bridge_startup_failure_reaps_tree[no-pidfile]',
              'test_native_bridge_startup_failure_reaps_tree[early-exit]',
              'test_native_bridge_startup_failure_reaps_tree[pre-yield]',
          }
          for name in sorted(expected):
              found = [case for case in cases if case.attrib['name'] == name]
              assert len(found) == 1, f'Native evidence missing or duplicated: {name}'
              assert not any(found[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')), name
              print(f'Executed and passed: {name}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            pytest.log
            pytest.rc
            pytest.status
            pytest-results.xml
          if-no-files-found: error
