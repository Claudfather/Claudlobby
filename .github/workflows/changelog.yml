name: Changelog

# Every PR adds its changelog entry as one file, changelog.d/<head branch, each /
# as ->.md, or says in its description why it needs none (changelog.d/README.md).
# The weekly roll-up moves the fragments into CHANGELOG.md.
#
# The job runs the default branch's copy of bin/changelog.py, so a PR cannot loosen
# the check it is judged by. Only the PR that adds this workflow, while the default
# branch has neither file, runs its own copy; once the workflow is on the default
# branch, a missing checker there fails the job. The job name, "Changelog fragment",
# is the check name the merger requires.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  fragment:
    name: Changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: changelog-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The PR adds its changelog fragment
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git cat-file -e "origin/$DEFAULT_BRANCH:bin/changelog.py" 2>/dev/null; then
            git show "origin/$DEFAULT_BRANCH:bin/changelog.py" > "$RUNNER_TEMP/changelog.py"
          elif ! git cat-file -e "origin/$DEFAULT_BRANCH:.github/workflows/changelog.yml" 2>/dev/null; then
            echo "::notice title=Changelog fragment::This PR adds the check, so it runs the PR's own bin/changelog.py."
            cp bin/changelog.py "$RUNNER_TEMP/changelog.py"
          else
            echo "::error title=Changelog fragment::$DEFAULT_BRANCH runs this check but has no bin/changelog.py."
            exit 1
          fi
          python3 "$RUNNER_TEMP/changelog.py" check
