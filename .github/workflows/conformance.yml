name: conformance

# Boundary phase L4 — the conformance surfaces that the default test.yml lane
# (which installs only `.[dev]`) cannot cover:
#   * vault-tests   — the R3 hook-snippet parity gate + the N-bot contention test,
#                     which importorskip/skipif on the [vault] extra and so SKIP
#                     in the default lane (the CI-dead gate, issue #682). This lane
#                     installs the pinned engine so they actually run.
#   * rename-map    — the F8 drift gate: a live value in CLAUDNA_SKILL_RENAMES must
#                     still name a real clauDNA skills/ dir.
#   * claudron-refs — every Claudron path or URL this repo names must exist in
#                     Claudron at the revision in claudlobby/contracts/claudron-docs.ref.
#
# NOTE for the repo admin: add `vault-tests` to the branch's REQUIRED status checks
# so the R3 drift protection is real (a required check, not just present).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── R3 hook-snippet parity + N-bot contention, against the PINNED engine ──
  # The composer ships a rendered COPY of claudron's hook-settings contract
  # (_claudron_hook_entries / _merge_claudron_hooks); TestSnippetParity pins that
  # copy to the engine's settings_snippet/merge_settings. Both it and the N-bot
  # SessionEnd contention test carry `@pytest.mark.vault` and self-skip without the
  # [vault] extra — so this lane installs it and selects exactly those with -m vault.
  vault-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install git (the N-bot contention test drives real vault clones)
        run: sudo apt-get update && sudo apt-get install -y git
      - name: Install package + the pinned [vault] extra (claudron)
        # The pin lives in pyproject's [vault] extra (F1 lock, currently v0.9.0 —
        # bump policy: documentation/integrations/claudron-integration.md). Parity holds against the pin; the gate fails if
        # the composer's rendered copy ever drifts from it.
        run: pip install -e '.[dev,vault]'
      - name: Prepare installed resources in disposable checkout
        run: python tests/prepare_resources.py --disposable-checkout "$PWD"
      - name: Run the vault-mode gate (snippet parity + contention)
        # A quarantined vault test runs in quarantine.yml instead (where the
        # [vault] extra is absent, so it skips there too until it is fixed).
        run: pytest -q -m "vault and not quarantine"

  # ── F8 rename-map drift gate (stale-live-values only) ─────────────────────
  # Local-first: clauDNA is checked out and the gate is pointed at it. The
  # checkout is non-fatal — if clauDNA is unreachable the gate skips-with-notice
  # (exit 0), because this is CI convenience, never a required hosted dependency.
  rename-map-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Check out clauDNA (the consumed skill surface; marketplace-latest)
        id: claudna
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Claudfather/clauDNA
          path: .claudna-checkout
      - name: Run the rename-map drift gate
        # CLAUDNA_SKILLS_DIR points the gate at the checkout; if the checkout step
        # failed the dir is absent and the gate prints SKIP and exits 0 (local-first).
        env:
          CLAUDNA_SKILLS_DIR: ${{ github.workspace }}/.claudna-checkout/skills
        run: python -m claudlobby.conformance rename-map

  # P3 export contract: optional hosted convenience, never a required check.
  # An unavailable checkout skips with notice, so a sibling outage cannot block merges.
  export-contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Read consumed clauDNA ref
        id: export-ref
        run: echo "ref=$(cat claudlobby/contracts/claudna.ref)" >> "$GITHUB_OUTPUT"
      - name: Check out clauDNA export contract
        id: export-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Claudfather/clauDNA
          ref: ${{ steps.export-ref.outputs.ref }}
          path: .claudna-export-checkout
      - name: Skip unavailable clauDNA checkout
        if: steps.export-checkout.outcome != 'success'
        run: echo '::notice::SKIP export-contract - clauDNA checkout unavailable (local-first)'
      - name: Run released export contract gate
        if: steps.export-checkout.outcome == 'success'
        run: python -m claudlobby.conformance export-contract .claudna-export-checkout

  # Claudron paths and URLs: the docs, docstrings and instruction files here name files in the Claudron
  # repo, and nothing else checks that they exist. Claudron is checked out at the revision in
  # claudlobby/contracts/claudron-docs.ref (one full sha; documentation/integrations/claudron-integration.md
  # says who moves it and when), and the check fails when a reference does not resolve there. Local-first
  # like the clauDNA gates: an unavailable checkout skips with a notice, so a sibling outage cannot block a
  # merge. Stdlib only, so there is no package to install.
  claudron-refs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read the Claudron revision the references are checked at
        id: claudron-ref
        run: |
          ref=$(python3 -m claudlobby.claudron_refs --print-ref)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out Claudron at that revision
        id: claudron-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Claudfather/Claudron
          ref: ${{ steps.claudron-ref.outputs.ref }}
          path: .claudron-checkout
      - name: Skip unavailable Claudron checkout
        if: steps.claudron-checkout.outcome != 'success'
        run: echo '::notice::SKIP claudron-refs - Claudron checkout unavailable (local-first)'
      - name: Resolve every Claudron path this repo names
        if: steps.claudron-checkout.outcome == 'success'
        run: python3 -m claudlobby.claudron_refs --claudron .claudron-checkout
