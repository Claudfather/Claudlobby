# System defaults -- platform infrastructure layered into every fleet.
# These represent HOW claudlobby works, not WHAT a specific fleet does.
#
# Package-owned and pristine: fleet.yaml `defaults:` layers on top
# (system < fleet < bot), and fleet.yaml `system_defaults:` toggles remove
# whole categories.
#
#   host:      Host-global singletons -- one instance per host, NOT layered,
#              fixed `claudlobby-<name>` unit identity (no fleet prefix).
#              Composed into runtime/_host/timers/ and enrolled once per host
#              by `setup-system`. Opt-in host jobs (e.g. root-self-update)
#              ship behind explicit toggles via their own plans, never here.
#   defaults:  Per-fleet defaults, mirroring fleet.yaml's `defaults:` shape and
#              deep-merged down into every bot. `jobs:` drives fleet timer units
#              (a fleet may override an individual job by name); `hooks:` and
#              `observability:` compose into each bot.
#
# Job entries accept optional systemd timer knobs: `persistent: true`
# (catch up missed runs) and `randomized_delay: <seconds>` (start jitter);
# launchd has no equivalent, so plists ignore them.
#
# DEFAULTS RULE (ruled 2026-09-07). A job or door is ON by default unless it
# DELETES DATA, SPENDS MONEY, MUTATES OPERATOR SOURCE, or SENDS OUTBOUND TO
# PEOPLE AT SCALE. Everything else ships enrolled, because a behavior nobody
# can see is a behavior nobody has: a dozen doors shipped dormant here, each
# for a defensible local reason, and the composite was a system whose
# advertised workflow ran nowhere unless an operator had read a dozen source
# comments. What DOES stay opt-in is named where the operator looks --
# `claudlobby doctor` (the `switches` rung), `claudlobby plane doctor`, and
# the closing table of lib/setup-fleet and lib/setup-system -- each with the
# one line that arms it. The registry behind those surfaces is
# claudlobby/switches.py; a knob with no row there is reported as a DEAD flag
# by the validator, so this file and that one cannot drift apart quietly.
#
# `enroll: false` means DORMANT, and the two scopes enforce it differently
# because their enrollers differ. A FLEET job is composed-but-dormant: the
# units are emitted and listed in a DORMANT manifest beside them, which
# setup-fleet skips. A HOST job composes NO UNIT AT ALL (compose-time
# dormancy, chunk-N fold): setup-system enrolls every composed
# claudlobby-* unit it finds, so not composing is the only gate that cannot
# be forgotten, and an armed->unarmed flip PRUNES the composed units. Units
# an EARLIER release installed are walked back by setup-system on its next
# run, out loud -- dormancy that only ever applied forward left the one job
# that mutates operator source enabled on every host that had run the
# installer. A fleet opts a FLEET job in via fleet.yaml:
#   defaults:
#     jobs:
#       weekly-worker-restart: { enroll: true }
# A HOST job is armed in the host's own system.yaml -- host jobs deliberately
# bypass the fleet defaults merge, so fleet.yaml cannot reach one.

host:
  # Host jobs are host-scoped by design and so pass NO fleet. Which manager
  # receives their [FLEET-ALERT]/[FLEET-NOTICE] is therefore NOT decided here --
  # declare it as CLAUDLOBBY_ALERT_MANAGER in the ROOT .env (#1517). It is
  # deliberately not a field in this file: system.yaml is package-owned and
  # tracked, so a bot name here would commit a fleet-specific value and make an
  # accidental recipient look deliberate. Undeclared still works and now
  # discloses itself -- see documentation/environment-variables.md.
  jobs:
    # Stage the latest Claude Code binary daily (download-only; the staged
    # binary is applied on a bot's next natural restart or the weekly worker
    # bounce -- never a live fleet bounce). The script owns its PATH (npm /
    # claude resolution), so the unit needs no environment beyond
    # CLAUDLOBBY_ROOT.
    claude-update:
      script: "$CLAUDLOBBY_ROOT/lib/update-claude-code.sh"
      schedule: "*-*-* 04:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Metric-sample retention (spec §F20): age out raw metric_samples past
    # the 30-day incident-join window from the root's plane db. Host-scoped
    # (one plane db per install, not per fleet); family-scoped DELETE that
    # NEVER touches the ledger; runs from this timer, never the ingest-only
    # daemon.
    #
    # ON by default, and this is the one flip in this file that has to argue
    # against the letter of the rule ("deletes data"). What it deletes is raw
    # per-minute SAMPLES past the 30-day incident-join window -- the retention
    # every metrics store does, the hygiene an operator already assumes is
    # happening, and the reason the per-minute host probe is safe to ship on
    # at all. It cannot reach the ledger: the DELETE is family-scoped to
    # metric_samples and pinned so. What "deletes data" is meant to stop is a
    # door removing something the operator would miss; a 31-day-old load
    # average is not that. THE WINDOW STAYS THE KNOB -- widen it by overriding
    # the script line (e.g. "... prune --days 90"), and turn the door off
    # entirely with PLANE_PRUNE_ENABLED=0 in the host or root .env, which the
    # launcher says out loud on every disarmed run.
    plane-prune:
      script: "$CLAUDLOBBY_ROOT/lib/plane-prune.sh"
      schedule: "*-*-* 05:15:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Attention expiry sweep: emit a terminal `expired` task event for
    # every assignment whose deadline passed more than the horizon ago and
    # that nothing closed — the attention queue then shows what needs the
    # operator NOW, not last Tuesday. A Lane-B fact through normal ingest
    # (never a table write), idempotent by construction.
    #
    # ON by default: it is the aging half of the target workflow -- without it
    # a missed deadline sits in the attention queue forever and the queue
    # stops meaning anything. It writes one event per genuinely-abandoned row
    # and deletes nothing. Turn it off with PLANE_EXPIRE_ENABLED=0 in the host
    # or root .env (the launcher says so on every disarmed run). Horizon:
    # override the script line (e.g. "... --after-days 14").
    plane-expire:
      script: "$CLAUDLOBBY_ROOT/lib/plane-expire.sh"
      schedule: "*-*-* 05:30:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Host hardware/system facet emitter (spec §2b, cause=probe): reads the
    # VOLATILE facets (load, available RAM, free disk, Pi thermal/undervolt,
    # boot time) — which F12 keeps OUT of the registry keyframe — and emits
    # them as host.* metric_samples for the Host card. Per-minute cadence
    # (30k-row envelope, guarded by the plane-prune retention lane, which now
    # ships on beside it -- the two are one decision). ON by default: a
    # read-only emitter with no gate of its own beyond the estate silencer
    # (PLANE_EMIT_DISABLED=1), and the Host card is blank without it.
    plane-host-probe:
      script: "$CLAUDLOBBY_ROOT/lib/plane-host-probe.sh"
      interval: 60
      type: oneshot
    # Source-currency REPORT (read-only, never pulls): how far each framework
    # checkout -- claudlobby AND its discovered siblings -- is behind its newest
    # release, plus the distinct "on the newest release but main has moved"
    # case. Daily, because reporting is cheap and harmless. Applying is
    # update-siblings.sh on a weekly clock; the two are split so the signal
    # survives on a host that never enrolled the applier.
    notify-behind:
      script: "$CLAUDLOBBY_ROOT/lib/notify-behind.sh"
      schedule: "*-*-* 08:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Source-currency APPLY: fast-forward stale SIBLING checkouts to their newest
    # cut release, guarded (never a dirty tree, unpushed commits, or a diverged
    # one; ff-only) and loud (an event on every movement). $CLAUDLOBBY_ROOT is
    # deliberately excluded -- pulling the compositor is root-self-update, which
    # the `host:` note at the top of this file says ships behind its own
    # toggle, and the script lives in that repo.
    #
    # COMPOSED-BUT-DORMANT: this is the host job that mutates the
    # operator's source -- one of the four
    # categories in the defaults rule at the top of this file, so it STAYS
    # opt-in and a root pull must never arrive with it switched on.
    #
    # Its dormancy is now ENFORCED rather than merely declared. Before the
    # defaults flip this flag had NO code effect at all (#1385): setup-system
    # enrolled every composed unit it found, so every host running the
    # installer enrolled this job regardless of the false below. An unarmed
    # host job now composes NO unit, and setup-system additionally WALKS BACK
    # any unit an earlier release installed -- which is what makes "stays
    # opt-in" a fact rather than a comment, on a host that already ran.
    #
    # Arm it in THIS host's own system.yaml -- host jobs bypass the fleet
    # defaults merge, so the fleet.yaml recipe this comment used to print
    # could never have worked:
    #   host: { jobs: { update-siblings: { enroll: true } } }
    # notify-behind REPORTS regardless, so #1009's blind spot is closed even
    # with this dormant; enrolling only automates the remedy.
    #
    # Weekly, not daily: editable installs mean a pull changes the CLI for the
    # next subprocess call, so each run crosses a version boundary under a live
    # fleet. Sun 04:30 sits 30min ahead of weekly-worker-restart (Sun 05:00) so
    # that where BOTH are enrolled a restart applies it almost immediately --
    # the stage-then-apply split claude-update uses for the binary. Where the
    # restart is not enrolled the exposure runs to each bot's next natural
    # restart, which is the exposure the staged binary already carries.
    update-siblings:
      enroll: false
      script: "$CLAUDLOBBY_ROOT/lib/update-siblings.sh"
      schedule: "Sun *-*-* 04:30:00"
      type: oneshot
      persistent: true
      randomized_delay: 300
    # The observable plane's ingest daemon (unit: service = RESIDENT, no
    # schedule; supervision restarts it). One per host -- the plane db is
    # host-scoped.
    #
    # ON by default. The plane has been the estate's ONLY record since the F18
    # closure, so this is not new behavior arriving switched on -- it is the
    # fast rung of behavior every door already performs. Without it every emit
    # takes the cold CLI rung: still recorded, still disclosed, but an
    # interpreter spawn per event. It ingests; it deletes nothing, spends
    # nothing and sends nothing.
    #
    # Dormancy is COMPOSE-time for every host job (services first, because
    # the macOS enroll leg starts every claudlobby-*.plist it finds): unarmed
    # means NO units are even composed. That gate is unchanged -- only the
    # default moved.
    # DISARMING: flip enroll: false in THIS host's own system.yaml (host jobs
    # bypass the fleet defaults merge, so fleet.yaml cannot reach it) and
    # re-run generate (this PRUNES the composed units, so no future setup run
    # can re-enroll it) — then stop the installed unit yourself, since pruning
    # cannot reach what is already enrolled:
    #   linux:  systemctl --user disable --now claudlobby-plane-daemon.service
    #   macos:  launchctl bootout gui/$UID/claudlobby-plane-daemon
    plane-daemon:
      enroll: true
      unit: service
      script: "$CLAUDLOBBY_ROOT/lib/plane-daemon.sh"
    # Phase-4 operator plane (read-only UI). Same compose-time dormancy
    # contract as plane-daemon: unarmed composes NO units.
    #
    # ON by default, bound to LOCALHOST. Read-only over the plane db by
    # construction (mode=ro + query_only, no non-GET route, pinned), so it
    # cannot reach any of the four categories. Exposing it beyond the host --
    # the Tailscale Serve step -- stays deliberately the operator's, and is
    # the only part of this that could send anything anywhere.
    #
    # Needs the [plane-ui] extra (fastapi + uvicorn), which lib/setup-system
    # installs. Where it does not import, generate composes NO unit and the
    # switch table prints the pip line as this row's arm: an enrolled
    # Restart=always unit whose process exits 1 is a crash loop every 5s
    # forever, not an honest failure (see documentation/runbooks/plane-view.md).
    plane-view:
      enroll: true
      unit: service
      script: "$CLAUDLOBBY_ROOT/lib/plane-view.sh"
    # Disk pressure is a silent fleet-killer on small disks (the cheap-hardware
    # north star): daily root-usage check, FLEET ALERT past the threshold.
    disk-monitor:
      script: "$CLAUDLOBBY_ROOT/lib/disk-monitor.sh"
      schedule: "*-*-* 05:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # OOM guard on constrained hosts: daily fleet RSS vs available-RAM check,
    # FLEET ALERT when the reserve floor is breached.
    fleet-memory-check:
      script: "$CLAUDLOBBY_ROOT/lib/fleet-memory-check.sh"
      schedule: "*-*-* 05:30:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Reclaim browser processes a dead automation task left behind. One leaked
    # Playwright chromium (18 procs, ~1.4 GB, 51h old) was the bulk of an 11-day
    # ~490 MB/day headroom drift on a 15 GB Pi -- nothing owns an orphan, so
    # nothing frees it. Daily, not 6-hourly: the launchd translator reads the
    # first HH:MM out of the expression, so a multi-hour OnCalendar would
    # silently run once a day on macOS while running four times on Linux.
    orphan-browser-reaper:
      script: "$CLAUDLOBBY_ROOT/lib/orphan-browser-reaper.sh"
      schedule: "*-*-* 05:45:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Early-warning for the host-hardware failure modes that silently freeze a
    # whole cheap-hardware fleet: under-voltage / thermal throttling (vcgencmd)
    # and storage stalls -- SD/MMC bus hangs, kernel hung-task, FS I/O errors.
    # HOURLY, not daily (a storage stall can wedge the host within the hour, so
    # the daily monitors miss it); de-duped so a standing condition alerts once.
    host-health-check:
      script: "$CLAUDLOBBY_ROOT/lib/host-health-check.sh"
      schedule: "*-*-* *:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 300
    # Record what happened to every declared bot at each host boot (#1265).
    # Every boot measurement the estate has was taken because a bot happened to
    # self-start AND happened to look -- the thing measured is whether bots wake
    # up, and the instrument was a bot that woke up. The misses therefore
    # correlate with severity, and no past boot can be backfilled.
    #
    # POLLS, and the 30s is load-bearing rather than a cadence preference. Three
    # of the four facts expire and they expire at different times: .spawn is
    # REWRITTEN by every start-bot.sh run (so every keepalive restart, 60s
    # cadence, destroys it), session_created dies with the session, and the
    # derived label dies with the transcript at 30 days. There is no single
    # instant at which all four are valid for all bots -- a pass at ladder-end
    # plus a margin missed nine of 21 on the 2026-09-07 boot -- so each bot is
    # captured at its FIRST OBSERVATION and the interval has to sit inside the
    # keepalive window. Once the boot closes every later tick is two file tests.
    #
    # COMPOSED-BUT-DORMANT, and the reason is delivery mechanics rather than the
    # convention. lib/ is read ON DEMAND, PER USE -- no restart gate, no canary
    # window -- so a root pull is in force for every bot on its next call. The
    # pull that delivers this recorder delivers everything else accumulated with
    # it, live, to every fleet at once, and there is no deployment step at which
    # one bot could be staged ahead of the others.
    #
    # So enrollment IS the canary, and it is the only one available: the units
    # compose inert, ride whatever pull happens, and a host turns the recorder on
    # deliberately afterwards while watching it. Without that, the first host to
    # run it is every host.
    #
    # Host-job dormancy is COMPOSE-time, so unarmed emits no unit at all and no
    # setup run can re-enroll it. Armed in THIS host's OWN system.yaml -- host
    # jobs deliberately bypass the fleet defaults merge (load_host_jobs reads
    # only this file's `host.jobs`), so a fleet.yaml recipe cannot reach one:
    #   host:
    #     jobs:
    #       boot-capture: { enroll: true }
    # then `claudlobby generate` + `lib/setup-system`.
    #
    # The stamp half of #1265 (inject_stamp, called from start-bot.sh) has no
    # enrollment step at all -- it runs on every bot start the instant lib/ moves
    # -- so it carries its OWN per-fleet flag, BOOT_CAPTURE_ENABLED. Two gates
    # because there are two delivery paths, not for belt and braces.
    boot-capture:
      enroll: false
      script: "$CLAUDLOBBY_ROOT/lib/boot-capture.sh"
      interval: 30
      type: oneshot

defaults:
  hooks:
    PreToolUse:
      - command: "$CLAUDLOBBY_ROOT/lib/bot-vitals.sh"
      # Rewrite `@<botname>` out of GitHub-bound tool calls before they run
      # (#1019). Every fleet bot name is also a real GitHub account -- 19 of 21
      # belong to real people -- so an unguarded teammate reference emails a
      # stranger, and one has asked us to stop. Not a guardrail: nothing ever
      # INSTRUCTED @-mentioning on GitHub; the habit leaks from Telegram, where
      # it is correct, and an instruction cannot catch a correct convention
      # applied mid-prose to the wrong surface. Telegram is untouched.
      - command: "$CLAUDLOBBY_ROOT/lib/gh-mention-guard.sh"
    PostToolUse:
      - command: "$CLAUDLOBBY_ROOT/lib/bot-vitals.sh"
      # The OUTBOUND Telegram carrier (#1402): the plugin's MCP reply path
      # was the plane's blind spot -- a bot answering the operator left no
      # record while tg-post notices did. Matcher-scoped to the reply tool;
      # always on (PLANE_EMIT_DISABLED=1 is the one silencer), exit 0
      # on every path.
      - command: "$CLAUDLOBBY_ROOT/lib/plane-telegram-out.sh"
        matcher: "mcp__plugin_telegram_telegram__reply"
        timeout: 15
    # Ingestion layer for the ai-platform fleet-monitor (#785 Phase A): distil
    # each finished session into one structured JSONL row via a cheap Haiku
    # pass, so the monitor reasons over per-session digests and never over raw
    # transcripts (a real transcript is ~19 MB / ~5M tokens and cannot enter a
    # 200K context at all). Bounded by a qualifying gate + tail-cap; a session
    # below the gate still gets a row, written without a model call.
    #
    # COMPOSED DORMANT. This entry lands in every bot on every fleet, but the
    # script exits immediately unless the fleet sets SESSION_DIGEST_ENABLED=1 in
    # its fleet.yaml `env:`. That keeps the rollout per-fleet: generate composes
    # it everywhere harmlessly, and fleets are armed one at a time with their
    # Haiku spend watched between. Default-on would have fired across the whole
    # estate at the next generate or daily reload.
    SessionEnd:
      - command: "$CLAUDLOBBY_ROOT/lib/transcript-digest.sh"
        timeout: 150
    # Observable-plane session identity (PR-B T7, spec §19.6/F12): derives the
    # transcript-stable session_uid + a fresh per-process process_uid and
    # publishes them to $BOT_DIR/data/.plane-session for the doors. Composed
    # everywhere, always on (PLANE_EMIT_DISABLED=1 is the one silencer), exit
    # 0 on every path (a hook must never break a boot).
    SessionStart:
      - command: "$CLAUDLOBBY_ROOT/lib/plane-session-start.sh"
        timeout: 15
    # The INBOUND Telegram carrier (#1402): recognizes the plugin's channel
    # injection shape and records the OPERATOR's own message as a first-
    # class communication (sender human:<user>). Matches that shape ONLY --
    # ordinary prompts exit untouched, and stdout stays empty on every path
    # (UserPromptSubmit stdout is added to the model's context). Same
    # dormancy as the rest of the plane hooks.
    UserPromptSubmit:
      - command: "$CLAUDLOBBY_ROOT/lib/plane-telegram-in.sh"
        timeout: 15
      # Delivery becomes a JOIN (chunk P, #1501): the RECEIVER records what it
      # actually got. A tracked dispatch/report/briefing arrives with a
      # `⟦plane:<msg_id>⟧` trailer on its own final line; this hook recognises
      # it, strips it plus any `set +H; ` prefix, and records the byte length +
      # sha256 of the message proper as a `received` transmission keyed to the
      # sender's msg_id. The delivery view then PROVES delivery instead of
      # inferring it from the sender's Enter. Matches the trailer ONLY --
      # ordinary prompts exit at a zero-fork prefilter -- and stdout stays empty
      # on every path (UserPromptSubmit stdout feeds the model). Same dormancy.
      - command: "$CLAUDLOBBY_ROOT/lib/plane-dispatch-in.sh"
        timeout: 15
    # Observable-plane Telegram carrier, the RC-relay OUTBOUND half (#1412):
    # when a bot answers a Telegram-initiated turn with plain final text
    # (no reply tool call) the bridge's RC auto-relay delivers it and no
    # PostToolUse fires — this Stop hook records that final answer, carrier
    # state `unknown` (delivery unobserved); always on, exit 0 on every path.
    Stop:
      - command: "$CLAUDLOBBY_ROOT/lib/plane-rc-relay-out.sh"
        timeout: 15

  observability:
    pulse_interval: 300
    activity_stuck_threshold: 1800
    # A DEADLINE BY DEFAULT, SO THE WATCHDOG AND THE RE-CHECK HAVE A CLOCK
    # (chunk M-A, #1481; ruled 24h). SECONDS. 24h is 1440 MINUTES, and putting
    # that number here would give the estate a 24-minute deadline; `0` is an
    # open-ended dispatch, which mints no `expected_by` at all.
    #
    # This value is ONE of three spellings of a single fact and they are
    # pinned together (tests/test_composer.py): this tier, the composer's
    # `DEFAULT_DISPATCH_DEADLINE_S`, and `dispatch-task.sh`'s own literal for
    # a bot.conf composed before M-A. It sat at 1800 while the other two moved
    # to 86400, which meant every fleet using this tier -- i.e. nearly all of
    # them -- kept composing the old 30-minute clock and the ruling reached
    # nobody (measured on a bare fleet.yaml).
    #
    # The 30-minute threshold's own history -- the bimodal completion
    # distribution behind it, and why raising a threshold is not the fix for
    # false alerts -- is #946 and the CHANGELOG. What survives of it here is
    # the standing rule: DO NOT MOVE THIS NUMBER TO QUIET NOISE. A run of
    # false alerts makes that the obvious edit and it reaches every fleet at
    # the next generate; the intended fix is suppress-while-provably-working
    # (#946), and for work known to run long there is already a per-dispatch
    # door, `dispatch-task.sh --deadline-min <n>`, which widens the window for
    # the one task that needs it and trades away no stall detection anywhere
    # else.
    dispatch_deadline: 86400

  jobs:
    fleet-pulse:
      script: "$CLAUDLOBBY_ROOT/lib/fleet-pulse.sh"
      interval_from: observability.pulse_interval
      type: oneshot
    keepalive:
      script: "$CLAUDLOBBY_ROOT/lib/keepalive-all.sh"
      interval: 60
      type: oneshot
      # The per-bot plane emit is backgrounded and reaped on its own clock;
      # it must outlive the sweep. Without this the supervisor's control-group
      # kill at job exit silently dropped the LAST bot's heartbeat every tick
      # (measured: 1 sample in 7 days vs ~1300 for every sibling).
      abandon_children: true
    log-rotation:
      script: "$CLAUDLOBBY_ROOT/lib/log-rotate-fleet.sh"
      interval: 86400
      type: oneshot
    creds-check:
      script: "$CLAUDLOBBY_ROOT/lib/creds-check.sh"
      schedule: "*-*-* 06:00:00"
      # Desync multi-fleet hosts: every fleet ticks this against one shared
      # state file + the Telegram API (systemd-only; launchd ignores it).
      randomized_delay: 600
      type: oneshot
    # Mechanism 1 of the fleet update lifecycle: refresh plugins + composed
    # skills live every day (claude plugin update + generate, then mark running
    # bots for a keepalive-driven /reload). No restart, no context loss. Runs
    # before the binary-update window so the plugin cache is warm.
    reload-fleet:
      script: "$CLAUDLOBBY_ROOT/lib/reload-fleet.sh"
      schedule: "*-*-* 03:30:00"
      type: oneshot
    # Composed-but-dormant: bouncing workers onto the staged binary is
    # disruptive, so enrollment is a per-fleet opt-in (enroll: true in
    # fleet.yaml), never a cold-start default.
    weekly-worker-restart:
      enroll: false
      script: "$CLAUDLOBBY_ROOT/lib/weekly-worker-restart.sh"
      schedule: "Sun *-*-* 05:00:00"
      type: oneshot
    # Weekly per-bot data/ hygiene, analogous to log-rotation. Purges only
    # known-ephemeral files (vetted text-log names, *.bak) older than 30 days — durable files never age out.
    # A fleet changes retention by overriding this job's script line
    # (e.g. "... --purge --days 60").
    data-sweep:
      script: "$CLAUDLOBBY_ROOT/lib/data-sweep.sh --purge"
      schedule: "Sat *-*-* 07:00:00"
      type: oneshot
    # The task loop's re-check trigger (chunk M-B, #1481): hand each manager
    # ONE id-less re-check listing their open rows past deadline or older than
    # the max age (48h), with the four verbs and their commands, and ask for a
    # report naming what it did per row. The manager's answers are the plane
    # facts M-A added -- a chase, a supersede, a withdraw, an escalation -- so
    # the loop closes without a second bookkeeping surface.
    #
    # Every 6h, not daily: a re-check the fleet reads once a day is a report,
    # and the rows it names are ones a manager can act on now. The per-ROW
    # repeat window (24h, `--repeat-h`) is what keeps the cadence from becoming
    # nagging -- a row already named is skipped, and the skip is a plane read,
    # so a new stale row still gets through on the next sweep.
    #
    # ON by default -- this is the reaction the target workflow is FOR. It
    # DISPATCHES INTO A LIVE MANAGER SESSION, which is as far from read-only
    # as a timer gets, and it still ships on: what it sends is a message to
    # the fleet's own manager about the fleet's own stale rows, which is none
    # of the four categories in the defaults rule. A fleet that wants it quiet
    # sets TASK_RECHECK_ENABLED=0 in its fleet-tier .env; the launcher then
    # no-ops LOUDLY on every tick, so an off switch is visible in the log of
    # the host it is off on rather than reading as a broken timer. The
    # self-gate SHAPE is kept for exactly that -- it is an opt-OUT now.
    task-recheck:
      script: "$CLAUDLOBBY_ROOT/lib/task-recheck.sh"
      interval: 21600
      type: oneshot
