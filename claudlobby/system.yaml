# System defaults -- platform infrastructure layered into every fleet.
# These represent HOW claudlobby works, not WHAT a specific fleet does.
#
# Package-owned and pristine: fleet.yaml `defaults:` layers on top
# (system < fleet < bot), and fleet.yaml `system_defaults:` toggles remove
# whole categories.
#
#   host:      Host-global singletons -- one instance per host, NOT layered,
#              fixed `claudlobby-<name>` unit identity (no fleet prefix).
#              Composed into runtime/_host/timers/ and enrolled once per host
#              by `setup-system`. Opt-in host jobs (e.g. root-self-update)
#              ship behind explicit toggles via their own plans, never here.
#   defaults:  Per-fleet defaults, mirroring fleet.yaml's `defaults:` shape and
#              deep-merged down into every bot. `jobs:` drives fleet timer units
#              (a fleet may override an individual job by name); `hooks:` and
#              `observability:` compose into each bot.
#
# Job entries accept optional systemd timer knobs: `persistent: true`
# (catch up missed runs) and `randomized_delay: <seconds>` (start jitter);
# launchd has no equivalent, so plists ignore them.
#
# `enroll: false` marks a job composed-but-dormant: its units are still
# emitted, but they are listed in the timers/ DORMANT manifest and the setup
# backbone does not enroll them. A fleet opts in per job via fleet.yaml:
#   defaults:
#     jobs:
#       weekly-worker-restart: { enroll: true }

host:
  jobs:
    # Stage the latest Claude Code binary daily (download-only; the staged
    # binary is applied on a bot's next natural restart or the weekly worker
    # bounce -- never a live fleet bounce). The script owns its PATH (npm /
    # claude resolution), so the unit needs no environment beyond
    # CLAUDLOBBY_ROOT.
    claude-update:
      script: "$CLAUDLOBBY_ROOT/lib/update-claude-code.sh"
      schedule: "*-*-* 04:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Source-currency REPORT (read-only, never pulls): how far each framework
    # checkout -- claudlobby AND its discovered siblings -- is behind its newest
    # release, plus the distinct "on the newest release but main has moved"
    # case. Daily, because reporting is cheap and harmless. Applying is
    # update-siblings.sh on a weekly clock; the two are split so the signal
    # survives on a host that never enrolled the applier.
    notify-behind:
      script: "$CLAUDLOBBY_ROOT/lib/notify-behind.sh"
      schedule: "*-*-* 08:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Source-currency APPLY: fast-forward stale SIBLING checkouts to their newest
    # cut release, guarded (never a dirty tree, unpushed commits, or a diverged
    # one; ff-only) and loud (an event on every movement). $CLAUDLOBBY_ROOT is
    # deliberately excluded -- pulling the compositor is root-self-update, which
    # line 11 says ships behind its own toggle, and the script lives in that repo.
    #
    # COMPOSED-BUT-DORMANT, for the same reason line 11 gives: this is the first
    # host job that mutates the operator'"'"'s source, and a root pull must not
    # arrive with it switched on. A fleet arms it in fleet.yaml:
    #   defaults: { jobs: { update-siblings: { enroll: true } } }
    # notify-behind REPORTS regardless, so #1009'"'"'s blind spot is closed even
    # with this dormant; enrolling only automates the remedy.
    #
    # Weekly, not daily: editable installs mean a pull changes the CLI for the
    # next subprocess call, so each run crosses a version boundary under a live
    # fleet. Sun 04:30 sits 30min ahead of weekly-worker-restart (Sun 05:00) so
    # that where BOTH are enrolled a restart applies it almost immediately --
    # the stage-then-apply split claude-update uses for the binary. Where the
    # restart is not enrolled the exposure runs to each bot'"'"'s next natural
    # restart, which is the exposure the staged binary already carries.
    update-siblings:
      enroll: false
      script: "$CLAUDLOBBY_ROOT/lib/update-siblings.sh"
      schedule: "Sun *-*-* 04:30:00"
      type: oneshot
      persistent: true
      randomized_delay: 300
    # Disk pressure is a silent fleet-killer on small disks (the cheap-hardware
    # north star): daily root-usage check, FLEET ALERT past the threshold.
    disk-monitor:
      script: "$CLAUDLOBBY_ROOT/lib/disk-monitor.sh"
      schedule: "*-*-* 05:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # OOM guard on constrained hosts: daily fleet RSS vs available-RAM check,
    # FLEET ALERT when the reserve floor is breached.
    fleet-memory-check:
      script: "$CLAUDLOBBY_ROOT/lib/fleet-memory-check.sh"
      schedule: "*-*-* 05:30:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Reclaim browser processes a dead automation task left behind. One leaked
    # Playwright chromium (18 procs, ~1.4 GB, 51h old) was the bulk of an 11-day
    # ~490 MB/day headroom drift on a 15 GB Pi -- nothing owns an orphan, so
    # nothing frees it. Daily, not 6-hourly: the launchd translator reads the
    # first HH:MM out of the expression, so a multi-hour OnCalendar would
    # silently run once a day on macOS while running four times on Linux.
    orphan-browser-reaper:
      script: "$CLAUDLOBBY_ROOT/lib/orphan-browser-reaper.sh"
      schedule: "*-*-* 05:45:00"
      type: oneshot
      persistent: true
      randomized_delay: 600
    # Early-warning for the host-hardware failure modes that silently freeze a
    # whole cheap-hardware fleet: under-voltage / thermal throttling (vcgencmd)
    # and storage stalls -- SD/MMC bus hangs, kernel hung-task, FS I/O errors.
    # HOURLY, not daily (a storage stall can wedge the host within the hour, so
    # the daily monitors miss it); de-duped so a standing condition alerts once.
    host-health-check:
      script: "$CLAUDLOBBY_ROOT/lib/host-health-check.sh"
      schedule: "*-*-* *:00:00"
      type: oneshot
      persistent: true
      randomized_delay: 300

defaults:
  hooks:
    PreToolUse:
      - command: "$CLAUDLOBBY_ROOT/lib/bot-vitals.sh"
      # Rewrite `@<botname>` out of GitHub-bound tool calls before they run
      # (#1019). Every fleet bot name is also a real GitHub account -- 19 of 21
      # belong to real people -- so an unguarded teammate reference emails a
      # stranger, and one has asked us to stop. Not a guardrail: nothing ever
      # INSTRUCTED @-mentioning on GitHub; the habit leaks from Telegram, where
      # it is correct, and an instruction cannot catch a correct convention
      # applied mid-prose to the wrong surface. Telegram is untouched.
      - command: "$CLAUDLOBBY_ROOT/lib/gh-mention-guard.sh"
    PostToolUse:
      - command: "$CLAUDLOBBY_ROOT/lib/bot-vitals.sh"
    # Ingestion layer for the ai-platform fleet-monitor (#785 Phase A): distil
    # each finished session into one structured JSONL row via a cheap Haiku
    # pass, so the monitor reasons over per-session digests and never over raw
    # transcripts (a real transcript is ~19 MB / ~5M tokens and cannot enter a
    # 200K context at all). Bounded by a qualifying gate + tail-cap; a session
    # below the gate still gets a row, written without a model call.
    #
    # COMPOSED DORMANT. This entry lands in every bot on every fleet, but the
    # script exits immediately unless the fleet sets SESSION_DIGEST_ENABLED=1 in
    # its fleet.yaml `env:`. That keeps the rollout per-fleet: generate composes
    # it everywhere harmlessly, and fleets are armed one at a time with their
    # Haiku spend watched between. Default-on would have fired across the whole
    # estate at the next generate or daily reload.
    SessionEnd:
      - command: "$CLAUDLOBBY_ROOT/lib/transcript-digest.sh"
        timeout: 150

  observability:
    pulse_interval: 300
    reap_days: 7
    activity_stuck_threshold: 1800
    # DO NOT RAISE THIS TO QUIET overdue_dispatch NOISE. A run of false alerts
    # makes that the obvious move, and it is a one-line edit that reaches every
    # fleet at the next generate -- so the trade is recorded here, at the
    # number, rather than in the issue thread that settled it.
    #
    # The completion distribution is BIMODAL, not shifted: across 90 tracked
    # dispatches, 63 closed comfortably inside 30 minutes while the 26 that
    # alerted ran to a median of 218, and 81 of the 90 carried this default
    # untouched -- so those alerts measure the default rather than anyone's
    # estimate. Those counts are RELAYED: measured in one manager-evening and
    # recorded in #946, not independently re-derived here. What follows from
    # them is not relayed, and is deliberately stated without hedge.
    #
    # No single value serves both populations. Raising this to 14400 removes
    # AT LEAST HALF of those ~26 false alerts AND leaves a genuinely wedged bot
    # unnoticed for four hours instead of thirty minutes. At least half, not
    # most: a median says how many ran long and nothing about how much longer,
    # and completion tails typically skew right, so an unknown share of the 26
    # sits past 240 minutes and keeps alerting. The first effect is visible in
    # the alert log; the second is COUNTERFACTUAL and appears in no log at all,
    # which is exactly why the edit looks free.
    #
    # The intended fix is suppress-while-provably-working -- never alarm while
    # the bot is demonstrably active AND the alerted id is its oldest open row
    # -- tracked in #946, and deliberately not a threshold change: it buys
    # silence on a working bot without buying blindness on a stalled one, and
    # keys on the liveness predicate #935 is building rather than adding a
    # second one. For work known to run long there is already a per-dispatch
    # door, `dispatch-task.sh --deadline-min <n>`, which widens the window for
    # the one task that needs it and trades away no stall detection anywhere
    # else.
    dispatch_deadline: 1800

  jobs:
    fleet-pulse:
      script: "$CLAUDLOBBY_ROOT/lib/fleet-pulse.sh"
      interval_from: observability.pulse_interval
      type: oneshot
    keepalive:
      script: "$CLAUDLOBBY_ROOT/lib/keepalive-all.sh"
      interval: 60
      type: oneshot
    log-rotation:
      script: "$CLAUDLOBBY_ROOT/lib/log-rotate-fleet.sh"
      interval: 86400
      type: oneshot
    creds-check:
      script: "$CLAUDLOBBY_ROOT/lib/creds-check.sh"
      schedule: "*-*-* 06:00:00"
      # Desync multi-fleet hosts: every fleet ticks this against one shared
      # state file + the Telegram API (systemd-only; launchd ignores it).
      randomized_delay: 600
      type: oneshot
    # Mechanism 1 of the fleet update lifecycle: refresh plugins + composed
    # skills live every day (claude plugin update + generate, then mark running
    # bots for a keepalive-driven /reload). No restart, no context loss. Runs
    # before the binary-update window so the plugin cache is warm.
    reload-fleet:
      script: "$CLAUDLOBBY_ROOT/lib/reload-fleet.sh"
      schedule: "*-*-* 03:30:00"
      type: oneshot
    # Composed-but-dormant: bouncing workers onto the staged binary is
    # disruptive, so enrollment is a per-fleet opt-in (enroll: true in
    # fleet.yaml), never a cold-start default.
    weekly-worker-restart:
      enroll: false
      script: "$CLAUDLOBBY_ROOT/lib/weekly-worker-restart.sh"
      schedule: "Sun *-*-* 05:00:00"
      type: oneshot
    # Weekly per-bot data/ hygiene (event-JSONL bloat), analogous to
    # log-rotation. Purges only known-ephemeral files (events/*.jsonl, vetted
    # text-log names, *.bak) older than 30 days — durable files never age out.
    # A fleet changes retention by overriding this job's script line
    # (e.g. "... --purge --days 60").
    data-sweep:
      script: "$CLAUDLOBBY_ROOT/lib/data-sweep.sh --purge"
      schedule: "Sat *-*-* 07:00:00"
      type: oneshot
